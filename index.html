<style>
  :root{
    --bg: #101514;
    --cream: #F3E9D8;
    --muted: #9C978C;
    --muted2: #A39C8F;
    --orange: #CC8354;
    --orange-text: #241A12;
    --pill-border: rgba(255,255,255,0.12);
    --pill-bg: rgba(255,255,255,0.04);
  }

  *{ box-sizing: border-box; }

  html,body{
    height:100%;
    margin:0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    overflow-x:hidden;
  }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 64px 20px 40px;
  }

  .glow{
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events:none;
  }
  .glow::before, .glow::after{
    content:"";
    position:absolute;
    width: 60vw;
    height: 60vw;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.55;
  }
  .glow::before{
    top: -18vw;
    left: -18vw;
    background: radial-gradient(circle, rgba(178,108,58,0.55), transparent 70%);
  }
  .glow::after{
    bottom: -22vw;
    right: -18vw;
    background: radial-gradient(circle, rgba(28,74,64,0.55), transparent 70%);
  }

  header{
    text-align:center;
    margin-bottom: 34px;
  }

  h1{
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  header p{
    margin:0;
    color: var(--muted2);
    font-size: 1rem;
  }

  .toggle{
    display:inline-flex;
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    border-radius: 999px;
    padding: 5px;
    gap: 4px;
    margin-bottom: 18px;
  }

  .toggle button{
    border:none;
    background: transparent;
    color: var(--muted2);
    font-family: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 11px 22px;
    border-radius: 999px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap: 8px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .toggle button.active{
    background: var(--orange);
    color: var(--orange-text);
  }

  .mode-desc{
    color: var(--muted2);
    font-size: 0.95rem;
    margin-bottom: 22px;
    text-align:center;
  }

  .cat-wrap{
    position: relative;
    margin-bottom: 54px;
  }

  select.cat-select{
    appearance: none;
    -webkit-appearance: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 0.98rem;
    color: var(--cream);
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    border-radius: 999px;
    padding: 13px 44px 13px 22px;
    cursor:pointer;
  }
  select.cat-select:focus-visible{
    outline: 2px solid var(--orange);
    outline-offset: 2px;
  }

  .cat-wrap::after{
    content: "▾";
    position:absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted2);
    pointer-events:none;
    font-size: 0.85rem;
  }

  .status{
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    color: var(--orange);
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .result{
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.1rem, 6.4vw, 4.2rem);
    line-height: 1.12;
    text-align:center;
    max-width: 920px;
    min-height: 2.4em;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 46px;
    color: var(--cream);
  }

  .result.spinning{ opacity: 0.55; }

  .result.settle{ animation: pop 0.4s ease-out; }
  @keyframes pop{
    0%{ transform: translateY(-6px); opacity: 0.4; }
    100%{ transform: translateY(0); opacity: 1; }
  }

  .actions{
    display:flex;
    align-items:center;
    gap: 14px;
  }

  .spin-btn{
    background: var(--orange);
    color: var(--orange-text);
    border: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 16px 40px;
    border-radius: 999px;
    cursor:pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .spin-btn:hover:not(:disabled){ filter: brightness(1.08); }
  .spin-btn:active:not(:disabled){ transform: scale(0.97); }
  .spin-btn:disabled{ opacity: 0.6; cursor:default; }

  .icon-btn{
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid var(--pill-border);
    background: transparent;
    color: var(--muted2);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
    position: relative;
  }
  .icon-btn:hover{ background: var(--pill-bg); color: var(--cream); }
  .icon-btn svg{ width: 20px; height: 20px; }

  button:focus-visible{
    outline: 2px solid var(--orange);
    outline-offset: 3px;
  }

  .toast{
    position:absolute;
    bottom: 62px;
    left: 50%;
    transform: translateX(-50%) translateY(6px);
    background: var(--cream);
    color: #1a1f1c;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    white-space: nowrap;
  }
  .toast.on{ opacity: 1; transform: translateX(-50%) translateY(0); }

  .history{
    margin-top: 56px;
    width: 100%;
    max-width: 560px;
  }
  .history h2{
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted2);
    font-weight: 700;
    margin: 0 0 14px;
    text-align:center;
  }
  .history ul{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .history li{
    font-size: 0.88rem;
    color: var(--muted2);
    text-align:center;
    border-bottom: 1px solid var(--pill-border);
    padding-bottom: 10px;
  }
  .history li:last-child{ border-bottom:none; }
  .history li b{ color: var(--cream); font-weight: 600; }
  .history .empty{ text-align:center; color: var(--muted2); font-size: 0.88rem; }

  @media (max-width: 480px){
    .toggle{ flex-wrap: wrap; justify-content:center; }
    .actions{ flex-wrap: wrap; justify-content:center; }
  }

  @media (prefers-reduced-motion: reduce){
    .result.settle{ animation: none; }
  }
</style>
</head>

<header>

  <p>spin a client, spin a build — no timer, just start.</p>

<div class="result" id="resultText">tap spin to begin</div>

<div class="actions">

  <button class="icon-btn" id="copyBtn" title="Copy result" aria-label="Copy result">

  </button>
</div>

<div class="history">
  <h2>Past pulls</h2>
  <ul id="historyList"></ul>
  <p class="empty" id="emptyHint">Nothing yet — spins will stack up here.</p>
</div>

  const CATEGORIES = ["All industries","Local & Service","Food & Drink","Creative & Media","Health & Wellness","Retail & Commerce","Community & Education","Tech & Digital","Finance & Legal"];

  const modeDescText = {
    persona: "Who you're designing for.",
    project: "What you're going to build."
  };

  const toggle = document.getElementById('modeToggle');
  const modeDesc = document.getElementById('modeDesc');
  const catSelect = document.getElementById('catSelect');
  const statusLabel = document.getElementById('statusLabel');
  const resultText = document.getElementById('resultText');
  const spinBtn = document.getElementById('spinBtn');
  const copyBtn = document.getElementById('copyBtn');
  const copyToast = document.getElementById('copyToast');
  const historyList = document.getElementById('historyList');
  const emptyHint = document.getElementById('emptyHint');

  let mode = 'persona';
  let spinning = false;
  let currentResult = null;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  CATEGORIES.slice(1).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    catSelect.appendChild(opt);
  });

  toggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn || spinning) return;
    toggle.querySelectorAll('button').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-selected','false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-selected','true');
    mode = btn.dataset.mode;
    modeDesc.textContent = modeDescText[mode];
  });

  function currentPool(){
    const source = mode === 'persona' ? PERSONAS : PROJECTS;
    const cat = catSelect.value;
    const filtered = cat === 'all' ? source : source.filter(item => item[1] === cat);
    return filtered.length ? filtered : source;
  }

  function pickDifferent(list, avoid){
    if(list.length < 2) return list[0][0];
    let v;
    do { v = list[Math.floor(Math.random()*list.length)][0]; } while(v === avoid);
    return v;
  }

  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  function addHistoryRow(mode, text){
    emptyHint.style.display = 'none';
    const li = document.createElement('li');
    li.innerHTML = `<b>${mode === 'persona' ? 'For' : 'Build'}:</b> ${text}`;
    historyList.prepend(li);
    while(historyList.children.length > 6){
      historyList.removeChild(historyList.lastChild);
    }
  }

  function spin(){
    if(spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    statusLabel.textContent = 'Spinning';

    const pool = currentPool();
    const finalItem = pool[Math.floor(Math.random()*pool.length)][0];
    const finalDisplay = capitalize(finalItem);

    if(reduceMotion){
      resultText.textContent = finalDisplay;
      finishSpin(finalDisplay);
      return;
    }

    resultText.classList.add('spinning');
    const totalMs = 1100;
    const start = performance.now();
    let last = null;

    function tick(now){
      const elapsed = now - start;
      if(elapsed >= totalMs){
        resultText.textContent = finalDisplay;
        resultText.classList.remove('spinning');
        resultText.classList.add('settle');
        setTimeout(()=> resultText.classList.remove('settle'), 420);
        finishSpin(finalDisplay);
        return;
      }
      resultText.textContent = capitalize(pickDifferent(pool, last));
      last = resultText.textContent;
      const progress = elapsed / totalMs;
      const delay = 45 + 230 * Math.pow(progress, 2);
      setTimeout(()=> requestAnimationFrame(tick), delay);
    }
    requestAnimationFrame(tick);
  }

  function finishSpin(finalDisplay){
    currentResult = { mode, text: finalDisplay };
    addHistoryRow(mode, finalDisplay);
    statusLabel.textContent = 'Ready';
    spinning = false;
    spinBtn.disabled = false;
  }

  function copyResult(){
    if(!currentResult) return;
    const label = currentResult.mode === 'persona' ? 'Client' : 'Build';
    navigator.clipboard.writeText(`${label}: ${currentResult.text}`).then(()=>{
      copyToast.classList.add('on');
      setTimeout(()=> copyToast.classList.remove('on'), 1300);
    }).catch(()=>{});
  }

  spinBtn.addEventListener('click', spin);
  copyBtn.addEventListener('click', copyResult);

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>

</body>
</html>
